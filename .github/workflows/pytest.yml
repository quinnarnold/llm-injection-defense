name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            fastapi \
            httpx \
            beautifulsoup4 \
            torch \
            transformers \
            haystack-ai \
            chroma-haystack \
            sentence-transformers \
            scikit-learn \
            numpy

      - name: Run pytest
        run: pytest
