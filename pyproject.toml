[project]
name = "ask-tupper"
version = "0.2.0"
description = "Fine-tuned campus assistant for Bryant University"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "haystack-ai>=2.5",
    "chroma-haystack>=0.4",
    "sentence-transformers>=4.1",
    "llm-guard>=0.3",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.30",
]

[project.optional-dependencies]
training = [
    "unsloth>=2025.3",
    "trl>=0.12",
    "vllm>=0.6",
    "datasets>=3.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.48",
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
